# The repository holds the GitLab setup, the app and the docs, so the app's
# pipeline lives here rather than at the repository root: setup_project.sh
# points the project's ci_config_path at this file.
#
# Only the stages that have jobs. The check jobs run on every pipeline; the
# deploy and migrate jobs are manual and live in the deploy stage.
stages: [lint, test, deploy]

variables:
  # The runner mounts a host directory at /cache (see the volumes in
  # gitlab/templates/runner-config.toml.tmpl), so a cache there survives into the
  # next pipeline instead of being rebuilt. uv's is one shared directory,
  # because its cache is content-addressed; ruff's and mypy's are built from the
  # project's own files, so each is scoped per project in the jobs below.
  UV_CACHE_DIR: /cache/uv
  # Fail on a stale uv.lock rather than resolving something else, and never let
  # uv fetch a Python: the job image's interpreter is the pin.
  UV_FROZEN: "1"
  UV_NO_PYTHON_DOWNLOADS: "1"

workflow:
  # When pipeline is created (checks top-down, until first condition is met)
  rules:
    # Run when a Merge Request is opened targeting the default branch
    # (also triggers when a commit is pushed to the merged branch)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH

    # Run when code is pushed directly to the default branch (after an MR is merged)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

    # Do not run for any other branch pushes (implied default behavior)

    # # Run on merge requests
    # - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # # Run on commits to main (triggers pipeline when branch is merged to main;
    # # otherwise, not being triggered, since direct push to main is disabled)
    # - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # # Do not run if pushing to a branch with an open merge request
    # - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
    #   when: never
    # # Run when pushing to a branch without an open MR
    # - if: $CI_COMMIT_BRANCH

# Shared by the three check jobs. rules:changes is resolved from the repository
# root, so it carries the app's prefix.
#
# The tag pins the Python interpreter; uv within the image floats, because no
# published tag combines a uv version with a Python one.
.python:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  before_script:
    - cd project
    - uv sync --frozen
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [project/**/*]
    - if: $CI_COMMIT_BRANCH
      changes: [project/**/*]

lint:
  extends: .python
  stage: lint
  variables:
    # ruff's cache is built from the files it linted, so it is scoped per project.
    RUFF_CACHE_DIR: /cache/ruff/$CI_PROJECT_PATH_SLUG
  script:
    # Gate and report are separate invocations on purpose: `ruff check --diff`
    # implies --fix-only and exits 0, so it can only ever describe fixes.
    - |
      status=0
      uv run ruff check src || status=1
      uv run ruff format --check src || status=1
      echo "--- what 'ruff check --fix' would change ---"
      uv run ruff check --diff src || true
      echo "--- what 'ruff format' would change ---"
      uv run ruff format --diff src || true
      exit "$status"

typecheck:
  extends: .python
  stage: lint
  variables:
    # mypy's cache is built from the modules it checked, so it is scoped per project.
    MYPY_CACHE_DIR: /cache/mypy/$CI_PROJECT_PATH_SLUG
  script:
    - uv run mypy

test:
  extends: .python
  stage: test
  services:
    - postgres:16-alpine
  variables:
    # The service container's own bootstrap credentials, repeated as app's admin
    # connection the tests create their roles and databases through: two sources
    # that have to agree, so they are written next to each other.
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: postgres
    DB__HOST: postgres
    DB__PORT: "5432"
    DB__DEFAULT_DATABASE: postgres
    DB__DEFAULT_USERNAME: postgres
    DB__DEFAULT_PASSWORD: postgres
  script:
    # Other app settings are copied from .env.example
    - cp .env.example .env
    - uv run pytest

# Manual production deployment, run by hand from a main pipeline. The order and
# guards live in gitlab/lib/deployment.sh.
deploy:
  stage: deploy
  image: docker:24.0.5-git  # git, the Docker CLI and the Compose plugin
  needs: []  # runnable immediately, without waiting for the checks
  resource_group: tutorial-production  # serialise with the migrate job
  allow_failure: true  # optional: a merged main pipeline is green without it
  variables:
    TARGET_REF: ""  # commit SHA or branch; empty means this commit
    DEPLOY_COLOR: ""  # blue or green
    NGINX_PORT: "8080"  # the compose file's published nginx port
    GIT_DEPTH: "0"  # resolving an arbitrary commit needs full history
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    # Read into memory: the script checks out TARGET_REF, rewriting the working
    # tree under a shell that would otherwise be reading the file from disk.
    - sh -c "$(cat gitlab/lib/deployment.sh)"

# Manual database migration, run by hand from a main pipeline. The order and
# guards live in gitlab/lib/migration.sh.
migrate:
  stage: deploy
  image: docker:24.0.5-git  # git, the Docker CLI and the Compose plugin
  needs: []  # runnable immediately, without waiting for the checks
  resource_group: tutorial-production  # serialise with the deploy job
  allow_failure: true  # optional: a merged main pipeline is green without it
  variables:
    TARGET_REF: ""  # commit SHA or branch; empty means this commit
    DIRECTION: "upgrade"  # upgrade or downgrade
    REVISION: "head"  # alembic revision; downgrade needs an explicit one
    GIT_DEPTH: "0"  # resolving an arbitrary commit needs full history
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    # Read into memory: the script checks out TARGET_REF, rewriting the working tree.
    - sh -c "$(cat gitlab/lib/migration.sh)"
