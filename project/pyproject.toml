[project]
name = "gitlab-tutorial-api"
version = "0.1.0"
description = "FastAPI + PostgreSQL service for the GitLab CI/CD tutorial"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "email-validator>=2.2.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.9",
]

[tool.ruff]
# target-version is left unset: ruff reads it from project.requires-python.
# The pipeline lints src/ only, so a bare `ruff check` here has to mean what it
# means there.
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
# env.py, the revisions and app_db.py are loaded by path rather than imported,
# so the target set is the whole package and not just the entrypoint.
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-n auto"
