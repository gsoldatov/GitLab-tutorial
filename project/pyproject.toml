[project]
name = "gitlab-tutorial-api"
version = "0.1.0"
description = "FastAPI + PostgreSQL service for the GitLab CI/CD tutorial"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "email-validator>=2.2.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.51.0",
]
